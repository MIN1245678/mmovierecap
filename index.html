<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mmmovierecap Studio Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white p-6">
    <div class="max-w-2xl mx-auto">
        <h1 class="text-center text-2xl font-bold mb-6">Mmmovierecap Studio</h1>
        
        <!-- Translation Section -->
        <div class="bg-slate-900 p-6 rounded-2xl border border-slate-700">
            <input type="file" id="videoFile" class="mb-4 w-full">
            <button onclick="translateVideo()" class="w-full bg-blue-600 py-3 rounded-xl font-bold">ဘာသာပြန်မည်</button>
            
            <div id="resultArea" class="mt-6 hidden">
                <div class="flex justify-between items-center mb-2">
                    <p class="text-sm font-bold">ဘာသာပြန်စာသား:</p>
                    <button onclick="copyText()" class="bg-green-600 px-3 py-1 text-xs rounded-lg">Copy</button>
                </div>
                <textarea id="output" class="w-full h-40 bg-black text-slate-300 p-4 rounded-xl border border-slate-600"></textarea>
            </div>
        </div>
    </div>

    <script>
        function translateVideo() {
            const file = document.getElementById('videoFile').files[0];
            if(!file) { alert("ဗီဒီယိုဖိုင် ရွေးပါ"); return; }
            
            document.getElementById('resultArea').classList.remove('hidden');
            document.getElementById('output').value = "00:01 - ဤသည်မှာ ဘာသာပြန်ထားသော စာသားဖြစ်ပါသည်။\n00:05 - နောက်ထပ် စာသားများလည်း ဤနေရာတွင် ပေါ်လာပါမည်။";
        }
        function copyText() {
            const copyText = document.getElementById("output");
            copyText.select();
            document.execCommand("copy");
            alert("Copy ကူးပြီးပါပြီ!");
        }
    </script>
</body>
</html>
