<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mmmovierecap Studio</title>
</head>
<body style="background: #111; color: #fff; padding: 20px; font-family: sans-serif;">
    <h2 style="text-align: center;">Mmmovierecap Studio Pro</h2>
    
    <div style="background: #222; padding: 20px; border-radius: 10px;">
        <input type="file" id="vid" accept="video/*" style="width: 100%; margin-bottom: 10px;">
        <button onclick="runApp()" style="width: 100%; padding: 10px; background: #007bff; color: white; border: none; border-radius: 5px;">ဘာသာပြန်မည်</button>
    </div>

    <div id="res" style="margin-top: 20px; display: none;">
        <p>ဘာသာပြန်စာသား:</p>
        <textarea id="out" style="width: 100%; height: 100px; background: #000; color: #0f0; padding: 10px;"></textarea>
        <button onclick="copyOut()" style="width: 100%; padding: 10px; background: #28a745; color: white; border: none; margin-top: 5px;">Copy ကူးရန်</button>
    </div>

    <script>
        function runApp() {
            var file = document.getElementById('vid').files[0];
            if(!file) { alert('ဗီဒီယိုဖိုင် ရွေးပေးပါ'); return; }
            document.getElementById('res').style.display = 'block';
            document.getElementById('out').value = "00:01 - AI ဘာသာပြန်စတင်ပါပြီ...\n00:05 - ဗီဒီယိုဖိုင် - " + file.name;
        }
        function copyOut() {
            var t = document.getElementById('out');
            t.select();
            document.execCommand('copy');
            alert('Copy ကူးပြီးပါပြီ');
        }
    </script>
</body>
</html>
