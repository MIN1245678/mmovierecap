<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mmmovierecap Studio Pro V10</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pyidaungsu:wght@400;700&display=swap');
        body { font-family: 'Pyidaungsu', sans-serif; background: linear-gradient(135deg, #050511 0%, #150226 50%, #2e0224 100%); background-attachment: fixed; color: #f1f5f9; }
        .premium-card { background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.08); box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8); }
        .btn-blue-premium { background: linear-gradient(135deg, #007AFF 0%, #00c6ff 100%); transition: all 0.3s ease; }
        .btn-premium { background: linear-gradient(135deg, #7303c0 0%, #ec38bc 100%); transition: all 0.3s ease; }
        #customToast { transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); transform: translateY(100px); opacity: 0; z-index: 99999; }
        #customToast.show { transform: translateY(0); opacity: 1; }
        .progress-bar-fill { transition: width 0.3s ease; }
    </style>
</head>
<body class="min-h-screen p-3 md:p-8 flex flex-col items-center">
    
    <div id="customToast" class="fixed bottom-6 right-6 z-50 bg-slate-900 border border-purple-500/35 text-white text-xs font-bold px-6 py-4 rounded-2xl shadow-2xl flex items-center gap-3">
        <span id="toastMessage">အောင်မြင်ပါသည်!</span>
    </div>

    <div class="w-full max-w-7xl">
        <header class="text-center mb-8 mt-4">
            <h1 class="text-4xl md:text-5xl font-extrabold tracking-tight mb-2">
                <span class="bg-clip-text text-transparent bg-gradient-to-r from-blue-400 via-purple-400 to-pink-500">Mmmovierecap Studio Pro</span>
            </h1>
            <p class="text-slate-400 text-xs font-bold uppercase tracking-[0.3em]">AI ဗီဒီယို ဘာသာပြန်နှင့် အသံထုတ်လုပ်ရေး စနစ်</p>
        </header>

        <div class="grid grid-cols-1 xl:grid-cols-2 gap-8 items-start mb-10">
            <!-- Video Section -->
            <div class="premium-card p-6 md:p-8 rounded-[2rem]">
                <h3 class="text-xs font-bold text-slate-400 uppercase mb-4 tracking-widest">🎬 ဖုန်းထဲမှ ဗီဒီယို ရွေးချယ်ရန်</h3>
                <input type="file" id="videoInput" accept="video/*" onchange="handleVideoSelection(event)" class="w-full text-xs text-slate-400 mb-4 border border-dashed border-slate-700 p-4 rounded-xl cursor-pointer">
                <p id="fileNameDisplay" class="text-xs text-blue-400 font-bold mb-4">ဖိုင်ရွေးချယ်ထားခြင်း မရှိသေးပါ</p>
                
                <div id="progressArea" style="display: none;" class="mb-6 bg-slate-950/60 p-4 rounded-2xl border border-slate-800">
                    <div class="flex justify-between text-xs font-bold mb-2 text-slate-300">
                        <span id="progressText">လုပ်ဆောင်နေသည်...</span>
                        <span id="percentText">0%</span>
                    </div>
                    <div class="w-full bg-slate-800 h-3 rounded-full overflow-hidden">
                        <div id="progressBar" class="progress-bar-fill bg-gradient-to-r from-blue-500 to-pink-500 h-full w-0"></div>
                    </div>
                </div>

                <button onclick="startAction('video', 'progressArea', 'progressBar', 'percentText', 'progressText')" class="btn-blue-premium w-full text-white font-black py-5 rounded-2xl text-xs uppercase tracking-widest shadow-lg">
                    ⚡ ရွေးထားသော ဗီဒီယိုကို ဘာသာပြန်မည်
                </button>
            </div>

            <!-- Voice Section -->
            <div class="premium-card p-6 md:p-8 rounded-[2rem]">
                <h3 class="text-xs font-bold text-purple-400 uppercase tracking-widest mb-4">🔊 Voice Studio</h3>
                <textarea id="ttsInput" placeholder="စာသားများထည့်ပါ..." class="w-full h-[150px] bg-slate-950/60 border border-slate-800 rounded-2xl p-4 text-sm text-slate-200 outline-none resize-none mb-4"></textarea>
                
                <div id="ttsProgressArea" style="display: none;" class="mb-4 bg-slate-950/60 p-4 rounded-2xl border border-slate-800">
                    <div class="flex justify-between text-xs font-bold mb-2 text-slate-300">
                        <span id="ttsProgressText">အသံထုတ်လုပ်နေသည်...</span>
                        <span id="ttsPercentText">0%</span>
                    </div>
                    <div class="w-full bg-slate-800 h-3 rounded-full overflow-hidden">
                        <div id="ttsProgressBar" class="progress-bar-fill bg-gradient-to-r from-purple-500 to-indigo-500 h-full w-0"></div>
                    </div>
                </div>

                <button onclick="startAction('tts', 'ttsProgressArea', 'ttsProgressBar', 'ttsPercentText', 'ttsProgressText')" class="w-full py-4 rounded-2xl text-xs font-black uppercase btn-premium text-white shadow-lg">
                    🔊 အသံထုတ်လုပ်မည်
                </button>
            </div>
        </div>
    </div>

    <script>
        function showToast(msg) {
            const t = document.getElementById('customToast');
            document.getElementById('toastMessage').innerText = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 3000);
        }
        function handleVideoSelection(event) {
            const file = event.target.files[0];
            if (file) {
                document.getElementById('fileNameDisplay').innerText = "ရွေးချယ်ထားသောဖိုင်: " + file.name;
                showToast("ဗီဒီယိုဖိုင် ရွေးချယ်ပြီးပါပြီ။");
            }
        }
        function startAction(type, areaId, barId, percentId, textId) {
            if (type === 'video') {
                const fileInput = document.getElementById('videoInput');
                if (fileInput.files.length === 0) {
                    showToast("ကျေးဇူးပြု၍ ဗီဒီယိုဖိုင် အရင်ရွေးပါ။");
                    return;
                }
            } else {
                const ttsInput = document.getElementById('ttsInput').value;
                if (!ttsInput.trim()) {
                    showToast("ကျေးဇူးပြု၍ စာသားများ ထည့်ပါ။");
                    return;
                }
            }

            const area = document.getElementById(areaId);
            area.style.display = 'block';
            let progress = 0;
            const bar = document.getElementById(barId);
            const percent = document.getElementById(percentId);
            const text = document.getElementById(textId);
            
            bar.style.width = '0%';
            percent.innerText = '0%';

            const interval = setInterval(() => {
                progress += 10;
                bar.style.width = progress + '%';
                percent.innerText = progress + '%';
                if (progress >= 100) {
                    clearInterval(interval);
                    text.innerText = "ပြီးဆုံးပါပြီ!";
                    showToast(type === 'video' ? "ဗီဒီယို ဘာသာပြန်ပြီးပါပြီ" : "အသံဖိုင် ထုတ်လုပ်ပြီးပါပြီ");
                }
            }, 200);
        }
    </script>
</body>
</html>
