<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YMA Movie Recap Studio Pro V10</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pyidaungsu:wght@400;700&display=swap');
        body { 
            font-family: 'Pyidaungsu', sans-serif; 
            background: linear-gradient(135deg, #050511 0%, #150226 50%, #2e0224 100%);
            background-attachment: fixed;
            color: #f1f5f9; 
        }
        .premium-card { 
            background: rgba(15, 23, 42, 0.9); 
            backdrop-filter: blur(20px); 
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
        }
        .chunk-card { 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
            background: rgba(30, 41, 59, 0.45); 
            border: 1px solid rgba(255, 255, 255, 0.05); 
        }
        .chunk-card:hover { 
            border-color: #ec38bc; 
            background: rgba(115, 3, 192, 0.25); 
            transform: translateY(-2px); 
            box-shadow: 0 8px 20px -10px rgba(236, 56, 188, 0.6); 
        }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #ec38bc; }
        .btn-premium {
            background: linear-gradient(135deg, #7303c0 0%, #ec38bc 100%);
            transition: all 0.3s ease;
        }
        .btn-premium:hover:not(:disabled) {
            filter: brightness(1.15);
            box-shadow: 0 0 25px rgba(236, 56, 188, 0.5);
            transform: translateY(-1px);
        }
        .btn-blue-premium {
            background: linear-gradient(135deg, #007AFF 0%, #00c6ff 100%);
            transition: all 0.3s ease;
        }
        .btn-blue-premium:hover:not(:disabled) {
            filter: brightness(1.15);
            box-shadow: 0 0 25px rgba(0, 198, 255, 0.5);
            transform: translateY(-1px);
        }
        .btn-green-premium {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            transition: all 0.3s ease;
        }
        .btn-green-premium:hover:not(:disabled) {
            filter: brightness(1.15);
            box-shadow: 0 0 25px rgba(16, 185, 129, 0.5);
            transform: translateY(-1px);
        }
        #customToast {
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform: translateY(100px);
            opacity: 0;
            z-index: 99999;
        }
        #customToast.show {
            transform: translateY(0);
            opacity: 1;
        }
        .progress-bar-fill {
            transition: width 0.3s ease;
        }
    </style>
</head>
<body class="min-h-screen p-3 md:p-8 flex flex-col items-center">
    
    <div id="customToast" class="fixed bottom-6 right-6 z-50 bg-slate-900 border border-purple-500/35 text-white text-xs font-bold px-6 py-4 rounded-2xl shadow-2xl flex items-center gap-3">
        <span id="toastIcon">✨</span>
        <span id="toastMessage">အောင်မြင်ပါသည်!</span>
    </div>

    <div class="w-full max-w-7xl">
        <header class="text-center mb-8 mt-4">
            <h1 class="text-4xl md:text-5xl font-extrabold tracking-tight mb-2">
                <span class="bg-clip-text text-transparent bg-gradient-to-r from-blue-400 via-purple-400 to-pink-500">YMA Movie Recap Studio Pro</span>
            </h1>
            <p class="text-slate-400 text-xs font-bold uppercase tracking-[0.3em]">AI ဗီဒီယို ဘာသာပြန်နှင့် အသံထုတ်လုပ်ရေး စနစ်</p>
        </header>

        <div class="grid grid-cols-1 xl:grid-cols-2 gap-8 items-start mb-10">
            <div class="space-y-6">
                <div class="premium-card p-6 md:p-8 rounded-[2rem]">
                    <h3 class="text-xs font-bold text-slate-400 uppercase mb-4 tracking-widest flex items-center gap-2">
                        <span class="w-2 h-2 rounded-full bg-blue-500 animate-pulse"></span> ဗီဒီယိုဖိုင် ထည့်သွင်းရန်
                    </h3>
                    
                    <div class="relative group mb-6">
                        <input type="file" id="videoInput" accept="video/*" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10">
                        <div class="border-2 border-dashed border-slate-700 group-hover:border-purple-500/50 rounded-2xl p-8 text-center transition-all bg-slate-900/40">
                            <div class="text-4xl mb-3">🎬</div>
                            <p id="fileNameDisplay" class="text-xs text-slate-400 font-medium">ဗီဒီယိုဖိုင်ကို ဤနေရာတွင် ရွေးချယ်ပါ</p>
                        </div>
                    </div>

                    <div>
                        <button id="startAutoTranslateBtn" disabled class="btn-blue-premium w-full disabled:opacity-30 disabled:cursor-not-allowed text-white font-black py-5 rounded-2xl text-xs uppercase tracking-widest transition-all">
                            ⚡ အစအဆုံး ဘာသာပြန်မည်
                        </button>
                    </div>
                </div>
            </div>

            <div class="space-y-6 xl:sticky xl:top-8">
                <div class="premium-card p-6 md:p-8 rounded-[2rem] border border-purple-500/10">
                    <h3 class="text-xs font-bold text-purple-400 uppercase tracking-widest mb-4 flex items-center gap-2">
                        <span class="w-2 h-2 rounded-full bg-purple-400"></span> Voice Studio (100k Characters)
                    </h3>
                    
                    <textarea id="ttsInput" placeholder="စာသားများထည့်ပါ..." class="w-full h-[220px] bg-slate-950/60 border border-slate-800 rounded-2xl p-4 text-sm text-slate-200 outline-none resize-none custom-scrollbar"></textarea>

                    <button id="ttsBtn" class="w-full mt-4 py-4 rounded-2xl text-xs font-black uppercase tracking-widest btn-premium text-white shadow-xl">
                        🔊 အသံ ထုတ်လုပ်မည်
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        function showToast(message, icon = "✨") {
            const toast = document.getElementById('customToast');
            document.getElementById('toastMessage').innerText = message;
            document.getElementById('toastIcon').innerText = icon;
            toast.classList.add('show');
            setTimeout(() => { toast.classList.remove('show'); }, 3000);
        }

        document.getElementById('videoInput').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                document.getElementById('fileNameDisplay').innerText = file.name;
                document.getElementById('startAutoTranslateBtn').disabled = false;
                showToast("ဗီဒီယို အဆင်သင့်ဖြစ်ပါပြီ", "✅");
            }
        });

        document.getElementById('ttsBtn').addEventListener('click', () => {
            const text = document.getElementById('ttsInput').value.trim();
            if (!text) {
                showToast("ကျေးဇူးပြု၍ စာသားထည့်ပါ", "⚠️");
                return;
            }
            showToast("အသံထုတ်လုပ်နေပါပြီ...", "⏳");
        });
    </script>
</body>
</html>
